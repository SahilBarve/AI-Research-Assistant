services:

  # PostgreSQL database
  postgres:
    image: postgres:17
    container_name: ai-research-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_research_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-research-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ai_research_assistant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

  # React frontend served by Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-research-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: ai_research_postgres_data

  qdrant_data:
    external: true
    name: qdrant_data

  backend_uploads:
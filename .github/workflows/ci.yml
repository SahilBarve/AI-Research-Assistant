# Name shown in the GitHub Actions tab.
name: CI

# Decide when GitHub should run this workflow.
on:
  # Run CI whenever code is pushed to main.
  push:
    branches:
      - main

  # Also run CI when a pull request targets main.
  pull_request:
    branches:
      - main

# Jobs are the individual tasks performed by GitHub Actions.
jobs:

  # --------------------------------------------------
  # Backend tests
  # --------------------------------------------------
  backend-tests:
    name: Backend Tests

    # GitHub provides a fresh Ubuntu machine for this job.
    runs-on: ubuntu-latest

    steps:

      # Download our repository onto the GitHub machine.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install backend dependencies.
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run the backend test suite.
      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  # --------------------------------------------------
  # Frontend build
  # --------------------------------------------------
  frontend-build:
    name: Frontend Build

    runs-on: ubuntu-latest

    steps:

      # Download our repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install exact frontend dependencies.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Create the production frontend build.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # --------------------------------------------------
  # Docker image builds
  # --------------------------------------------------
  docker-build:
    name: Docker Build

    runs-on: ubuntu-latest

    steps:

      # Download our repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the backend Docker image.
      - name: Build backend Docker image
        run: docker build -t ai-research-backend ./backend

      # Build the frontend Docker image.
      - name: Build frontend Docker image
        run: docker build -t ai-research-frontend ./frontend
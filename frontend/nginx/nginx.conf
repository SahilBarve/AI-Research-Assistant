# Nginx configuration for the React frontend
# and FastAPI reverse proxy.

server {
    listen 80;

    # Allow document uploads up to the backend's 50 MB limit.
    client_max_body_size 50M;

    # Serve the React application's static files.
    root /usr/share/nginx/html;

    # React uses client-side routing, so unknown paths
    # should fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to the FastAPI backend.
    location /api/ {
        proxy_pass http://backend:8000/api/;

        # Forward useful request information to FastAPI.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow enough time for local Ollama inference.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}